<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1919 620" role="img" aria-labelledby="title desc">
  <title id="title">Tasky login page preview</title>
  <desc id="desc">A Tasky application login page with a dark navigation bar, centered search field, and sign in card.</desc>
  <rect width="1919" height="620" fill="#fff"/>
  <rect width="1919" height="62" fill="#243237"/>
  <text x="24" y="39" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Tasky</text>
  <rect x="532" y="11" width="600" height="41" rx="20.5" fill="#5d686d" stroke="#7a858a" stroke-width="1"/>
  <circle cx="554" cy="31" r="5.5" fill="none" stroke="#d8dde0" stroke-width="2"/>
  <line x1="558" y1="35" x2="564" y2="41" stroke="#d8dde0" stroke-width="2" stroke-linecap="round"/>
  <text x="576" y="37" font-family="Arial, sans-serif" font-size="16" fill="#d3d8da">Search for tasks...</text>
  <path d="M1593 19c-4 0-7 3-7 7v7l-3 5v1h20v-1l-3-5v-7c0-4-3-7-7-7z" fill="#fff"/>
